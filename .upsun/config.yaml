applications:
  app:
    type: python:3.9

    web:
      commands:
        start: "gunicorn learning_log.wsgi:application"

    hooks:
      build: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput

    relationships:
      database: "db:postgresql"

    mounts:
      "static":
        source: local
        source_path: static

services:
  db:
    type: postgresql:14

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
